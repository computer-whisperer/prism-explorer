[package]
name = "prism-explorer"
description = "Color-managed file explorer — damascene UI, HDR-aware previews, built for big slow filesystems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "prism-explorer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

damascene-core.workspace = true
damascene-winit-wgpu.workspace = true

achromat.workspace = true
explorer-io.workspace = true
explorer-previews.workspace = true
explorer-thumbs.workspace = true

# RAM cap on decoded grid thumbnails.
lru = "0.18"

# mtime column formatting.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
