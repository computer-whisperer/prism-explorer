[package]
name = "prism-explorer"
description = "Color-managed file explorer — damascene UI, HDR-aware previews, built for big slow filesystems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "prism-explorer"

[[bin]]
name = "prism-explorer"
path = "src/main.rs"

# Renders every canned scene (src/fixtures.rs) through the damascene
# bundle pipeline: svg + tree dump + draw ops + lint into out/.
[[bin]]
name = "dump_bundles"
path = "src/bin/dump_bundles.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

damascene-core.workspace = true
damascene-wgpu.workspace = true
damascene-winit-wgpu.workspace = true

# The custom multi-window host loop (src/host.rs). Versions track
# damascene's own pins — the input mappers take winit types and the
# Runner takes wgpu handles, so majors must match.
winit = "0.30"
wgpu = "29"
arboard = { version = "3", features = ["wayland-data-control"] }
pollster = "0.4"

achromat.workspace = true
explorer-io.workspace = true
explorer-previews.workspace = true
explorer-thumbs.workspace = true

# RAM cap on decoded grid thumbnails.
lru = "0.18"

# mtime column formatting.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Portal filters carry mimetype patterns ("image/*"); matched against
# the extension-guessed type.
mime_guess = "2"

# org.freedesktop.FileManager1 + the portal FileChooser backend (each
# on its own service thread).
zbus = "5"
# Portal handlers await picker answers without blocking zbus dispatch.
async-channel = "2"
