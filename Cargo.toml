[workspace]
resolver = "2"
members = [
    "crates/explorer-io",
    "crates/explorer-previews",
    "crates/explorer-thumbs",
    "crates/explorer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/computer-whisperer/prism-explorer"
authors = ["Christian Balcom"]

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
damascene-core = "0.4.5"
damascene-wgpu = "0.4.5"
damascene-winit-wgpu = "0.4.5"

# Color-managed decode stack, shared with damascene-gallery and prism-bg.
# Git dep, pinned, until achromat is published to crates.io. Its vendored
# jpegxr is a path dep *inside* the achromat repo, so it resolves within the
# git checkout — no [patch.crates-io] needed here.
achromat = { git = "https://github.com/computer-whisperer/achromat.git", tag = "v0.1.0", features = ["damascene"] }

explorer-io = { path = "crates/explorer-io" }
explorer-previews = { path = "crates/explorer-previews" }
explorer-thumbs = { path = "crates/explorer-thumbs" }

# MSDF/text crates are ~500x slower unoptimized (per damascene's own
# profile guidance); image decode is also hot in dev runs.
[profile.dev.package.fdsm]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.jpegxr]
opt-level = 3
[profile.dev.package.jxl-oxide]
opt-level = 3
[profile.dev.package.jxl-render]
opt-level = 3
[profile.dev.package.jxl-vardct]
opt-level = 3
[profile.dev.package.jxl-modular]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
